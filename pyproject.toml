[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calcbook"
version = "0.1.0a4"
description = "结构构件批量计算书工具：Python 模板 + 批量参数 + Markdown/LaTeX 计算书"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pywebview>=5.0",
]

[project.scripts]
calcbook = "calcbook.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

# 前端构建产物（src/calcbook/web）随 wheel 分发，使用侧无需 Node
[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
calcbook = ["web/**/*", "vendor/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
